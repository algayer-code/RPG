<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lobby da campanha de RPG para consultar as fichas dos jogadores.">
  <title>Crônicas do Eclipse | Lobby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <span class="brand">RPG da mesa</span>
      <span class="player-count">06 jogadores</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <span class="section-kicker">fichas dos jogadores</span>
        <h1 id="page-title">Escolha um jogador</h1>
        <p class="intro-copy">Selecione uma ficha para continuar.</p>
      </section>

      <section class="player-grid" aria-label="Jogadores da mesa">
        <a class="player-card" href="joao.html"><span class="avatar"><img src="img/Joao.PNG" alt="João"></span><span class="player-name">João</span><span class="arrow" aria-hidden="true">→</span></a>
        <a class="player-card" href="carlos.html"><span class="avatar"><img src="img/Carlos.PNG" alt="Carlos"></span><span class="player-name">Carlos</span><span class="arrow" aria-hidden="true">→</span></a>
        <a class="player-card" href="kamai.html"><span class="avatar"><img src="img/Kamai.PNG" alt="Kamai"></span><span class="player-name">Kamai</span><span class="arrow" aria-hidden="true">→</span></a>
        <a class="player-card" href="felipe.html"><span class="avatar"><img src="img/Felipe.PNG" alt="Felipe"></span><span class="player-name">Felipe</span><span class="arrow" aria-hidden="true">→</span></a>
        <a class="player-card" href="willem.html"><span class="avatar"><img src="img/Willem.PNG" alt="Willem"></span><span class="player-name">Willem</span><span class="arrow" aria-hidden="true">→</span></a>
        <a class="player-card" href="yasmin.html"><span class="avatar"><img src="img/Yasmin.PNG" alt="Yasmin"></span><span class="player-name">Yasmin</span><span class="arrow" aria-hidden="true">→</span></a>
      </section>
    </main>
  </div>
</body>
</html>
